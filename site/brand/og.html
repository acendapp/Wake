<!doctype html>
<!-- Source for og.png — rendered to 1200x630 via headless Chrome (see build note
     in site/README.md). Not deployed; the rendered og.png is what's referenced. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #faf8f4;
        font-family: 'Playfair Display', Georgia, serif;
        color: #2a2a2a;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 56px; height: 56px; }
      .brand span { font-size: 40px; font-weight: 700; letter-spacing: 0.5px; }
      h1 {
        font-size: 96px;
        font-weight: 600;
        line-height: 1.05;
        max-width: 14ch;
      }
      .tagline {
        font-style: italic;
        font-weight: 400;
        font-size: 34px;
        color: #8a7b6a;
      }
      .rule { width: 120px; height: 4px; background: #8a6d2f; border-radius: 2px; margin-bottom: 28px; }
      /* a soft sun glow in the corner */
      .glow {
        position: absolute;
        right: -160px;
        top: -160px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, #fbf6ec 0%, #faf8f4 70%);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#8a6d2f" stroke-width="3.2" stroke-linecap="round">
          <line x1="32" y1="15" x2="32" y2="9" />
          <line x1="20" y1="20" x2="16" y2="16" />
          <line x1="44" y1="20" x2="48" y2="16" />
          <line x1="11" y1="44" x2="53" y2="44" />
        </g>
        <path d="M21 44 a11 11 0 0 1 22 0 Z" fill="#8a6d2f" />
      </svg>
      <span>Wake</span>
    </div>
    <div>
      <div class="rule"></div>
      <h1>Never have a bad morning again.</h1>
    </div>
    <div class="tagline">A voice that wakes you. A routine that gets smarter.</div>
  </body>
</html>
